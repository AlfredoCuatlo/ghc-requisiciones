<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requisiciones · Compras · GHC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* === VARIABLES BASE (GHC azul) — mismas que Órdenes de Compra === */
:root{
  --bg:#F5F4F0;--surface:#FFF;--s2:#F0EFE9;--s3:#E5E3DB;
  --bdr:#D8D5CC;--bdr2:#B8B5AB;
  --txt:#18170E;--mut:#6A6760;--mut2:#A3A09A;
  --acc:#1B4F72;--acc-lt:#EAF2F8;--acc-dk:#163F5C;
  --grn:#1A5C38;--grn-lt:#E8F5EE;
  --amber:#7A4F00;--amber-bg:#FEF3DC;
  --red:#991B1B;--red-bg:#FEE2E2;
  --vio:#3B2FA0;--vio-bg:#EDE9FE;
  --sans:'Sora',sans-serif;--mono:'Fira Code',monospace;
  --r:7px;--rl:11px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:var(--sans);font-size:13px;background:var(--bg);color:var(--txt);}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.mut{color:var(--mut)}
.shell{display:flex;height:100vh;overflow:hidden;}
.L{width:330px;min-width:290px;background:var(--surface);border-right:1px solid var(--bdr);display:flex;flex-direction:column;height:100vh;flex-shrink:0;}
.R{flex:1;overflow-y:auto;min-width:0;}
.lhd{padding:13px 13px 10px;border-bottom:1px solid var(--bdr);flex-shrink:0;}
.lhd-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.brand{display:flex;align-items:center;gap:9px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:10px;letter-spacing:.02em}
.lhd h1{font-size:14px;font-weight:700;letter-spacing:-.02em;}
.lhd p{font-size:10px;color:var(--mut);margin-top:1px;font-family:var(--mono);}
.btn-new{background:var(--acc);color:#fff;border:none;padding:6px 10px;border-radius:var(--r);font-weight:700;font-size:10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;font-family:var(--sans);}
.btn-new:hover{background:var(--acc-dk);}
.btn-new.alt{background:var(--s2);color:var(--mut);border:1.5px solid var(--bdr);padding:5px 8px}
.btn-new.alt:hover{border-color:var(--acc);color:var(--acc)}
.btn-new.alt.on{background:var(--acc-lt);color:var(--acc);border-color:var(--acc)}
.lsrch{padding:8px 10px;border-bottom:1px solid var(--bdr);flex-shrink:0;}
.sbox{position:relative;}
.sbox input{width:100%;background:var(--s2);border:1.5px solid var(--bdr);color:var(--txt);font-size:12px;padding:6px 10px 6px 28px;border-radius:var(--r);outline:none;font-family:var(--sans);}
.sbox input:focus{border-color:var(--acc);background:#fff;}
.si{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;}
.chips{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap;}
.chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;border:1.5px solid var(--bdr);background:#fff;color:var(--mut);cursor:pointer;user-select:none;font-family:var(--sans);}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.chip .c{font-family:var(--mono);opacity:.75;margin-left:2px}
.fsel{font-size:11px;padding:5px 8px;border-radius:var(--r);border:1.5px solid var(--bdr);background:var(--s2);width:100%;font-family:var(--sans);margin-top:5px;outline:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.rlist{flex:1;overflow-y:auto;min-height:0;}
.ritem{padding:9px 11px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s;}
.ritem:hover{background:var(--s2);}
.ritem.sel{background:var(--acc-lt);border-left:3px solid var(--acc);padding-left:8px;}
.ritem.urg{box-shadow:inset 3px 0 0 var(--red)}
.ri-num{font-family:var(--mono);font-size:10px;color:var(--acc);font-weight:600;}
.ri-tit{font-size:12px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ri-sub{font-size:10px;color:var(--mut);margin-top:1px;}
.lfoot{padding:7px 11px;border-top:1px solid var(--bdr);font-size:10px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.bdg{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;white-space:nowrap;display:inline-block}
.st-Pendiente{background:var(--s3);color:#4A4842}
.st-En-compra{background:var(--amber-bg);color:var(--amber)}
.st-En-pago,.st-OC-parcial{background:var(--acc-lt);color:var(--acc)}
.st-100-con-OC{background:var(--vio-bg);color:var(--vio)}
.st-Pagado,.st-Pagada{background:var(--grn-lt);color:var(--grn)}
.st-Cancelado,.st-Cancelada{background:var(--red-bg);color:var(--red)}
.b-urg{background:var(--red);color:#fff}
.b-rec{background:var(--grn);color:#fff}
.lempty{padding:24px 12px;text-align:center;color:var(--mut);font-size:12px;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--bdr2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:4px;}
@keyframes sp{to{transform:rotate(360deg);}}
.empty-r{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:var(--mut);gap:10px;text-align:center;padding:40px;}
.empty-r svg{opacity:.1;}.empty-r h2{font-size:15px;font-weight:700;color:var(--txt);}
.detail{padding:18px 22px;display:flex;flex-direction:column;gap:13px;}
.dcard{background:var(--surface);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;}
.dcard-hd{padding:12px 18px;border-bottom:1px solid var(--bdr);background:var(--s2);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.dcard-num{font-family:var(--mono);font-size:13px;color:var(--acc);font-weight:700;}
.dcard-tit{font-size:15px;font-weight:700;margin-top:2px;}
.dcard-sub{font-size:11px;color:var(--mut);margin-top:3px;}
.hd-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.abar{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px;}
.abtn{border:1.5px solid var(--bdr);background:#fff;color:var(--mut);padding:5px 10px;border-radius:var(--r);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:all .15s;white-space:nowrap;}
.abtn:hover{border-color:var(--acc);color:var(--acc);}
.abtn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--bdr);color:var(--mut)}
.abtn.prim{background:var(--acc);color:#fff;border-color:var(--acc);}
.abtn.grn{background:var(--grn);color:#fff;border-color:var(--grn);}
.abtn.red{border-color:var(--red);color:var(--red);}
.abtn.vio{background:var(--vio);color:#fff;border-color:var(--vio)}
.amounts{display:grid;grid-template-columns:repeat(5,1fr);}
.ait{padding:11px 16px;border-right:1px solid var(--bdr);}
.ait:last-child{border-right:none;}
.albl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);}
.aval{font-size:14px;font-weight:600;font-family:var(--mono);margin-top:3px;}
.prog{height:4px;background:var(--s3);border-radius:2px;overflow:hidden;margin-top:5px}
.prog>div{height:100%;background:var(--acc)}
.prog.g>div{background:var(--grn)}.prog.v>div{background:var(--vio)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);}
.mit{padding:9px 16px;border-right:1px solid var(--bdr);border-bottom:1px solid var(--bdr);}
.mit:nth-child(3n){border-right:none;}
.mit.full{grid-column:1/-1;border-right:none;}
.mlbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);}
.mval{font-size:12px;font-weight:500;margin-top:2px;}
.items-table{width:100%;border-collapse:collapse;font-size:12px;}
.items-table th{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--mut);padding:7px 10px;border-bottom:1.5px solid var(--bdr);text-align:left;background:var(--s2);white-space:nowrap}
.items-table th.r,.items-table td.r{text-align:right;font-family:var(--mono);}
.items-table td{padding:7px 10px;border-bottom:1px solid var(--bdr);vertical-align:top}
.items-table tr.sel td{background:var(--acc-lt)}
.items-table tr:last-child td{border-bottom:none}
.cardt{padding:10px 18px;border-bottom:1px solid var(--bdr);background:var(--s2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.cardt h3{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.selbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bdr);background:#fff;position:sticky;top:0;z-index:2}
.selbar b{font-size:11px;margin-right:4px}
.due-late{color:var(--red);font-weight:700}
.due-soon{color:var(--amber);font-weight:700}
.thumbs{display:flex;gap:5px;flex-wrap:wrap}
.thumb{width:42px;height:42px;border-radius:6px;border:1px solid var(--bdr);background:var(--s2) center/cover no-repeat;display:grid;place-items:center;font-size:16px;text-decoration:none}
.tl .e{padding:6px 18px;border-bottom:1px dashed var(--s3);font-size:12px}
.tl .e:last-child{border:0}
.banner{background:var(--vio-bg);border:1.5px solid var(--vio);color:var(--vio);border-radius:var(--rl);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:var(--r);padding:8px 10px;font-size:11px;margin:8px 0}
input,select,textarea{background:#fff;border:1.5px solid var(--bdr);color:var(--txt);font-size:12px;padding:7px 10px;border-radius:var(--r);outline:none;transition:border-color .15s;width:100%;font-family:var(--sans);}
input:focus,select:focus,textarea:focus{border-color:var(--acc);}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
input[type=date]{font-family:var(--mono);}
textarea{resize:vertical;min-height:50px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.fg label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);}
.frow{display:grid;gap:9px;}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:repeat(4,1fr)}
.bsub{background:var(--acc);color:#fff;border:none;padding:8px 16px;border-radius:var(--r);font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);}
.bsub:hover{background:var(--acc-dk);}.bsub:disabled{opacity:.4;cursor:not-allowed;}
.bcancel{background:transparent;border:1.5px solid var(--bdr);color:var(--mut);padding:7px 13px;border-radius:var(--r);font-size:12px;cursor:pointer;font-family:var(--sans);}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:700;}
.modal-box{background:#fff;border-radius:11px;padding:20px;max-width:640px;width:94%;max-height:90vh;overflow:auto;box-shadow:0 14px 44px rgba(0,0,0,.16);}
.modal-title{font-size:13px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:11px;color:var(--mut);margin-bottom:12px;}
.modal-footer{display:flex;gap:7px;justify-content:flex-end;margin-top:12px;padding-top:11px;border-top:1px solid var(--bdr);}
.toast{position:fixed;bottom:14px;right:14px;background:var(--txt);color:#fff;border-radius:8px;padding:9px 13px;font-size:12px;z-index:999;max-width:340px;font-family:var(--sans);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.ok{background:var(--grn);}.toast.err{background:var(--red);}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--grn);font-weight:600}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--grn);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
/* tablero */
.kpis{display:grid;grid-template-columns:repeat(6,1fr)}
.hbar{display:grid;grid-template-columns:170px 1fr 40px;gap:8px;align-items:center;padding:5px 18px;font-size:11px}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:14px;background:var(--s2);border-radius:3px;overflow:hidden}
.hbar .b div{height:100%;background:var(--acc);border-radius:3px}
.hbar .v{font-family:var(--mono);text-align:right}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;padding:10px 18px 4px}
.days div{flex:1;background:var(--acc);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.days div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap;font-family:var(--mono)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;overflow:auto}
.login .fcard{width:370px;background:#fff;border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden}
.fhd{padding:11px 18px;background:var(--acc);color:#fff;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
@media(max-width:900px){html,body{height:auto;overflow:auto}.shell{flex-direction:column;height:auto}.L{width:100%;height:auto;max-height:50vh}.amounts,.kpis{grid-template-columns:repeat(2,1fr)}.mgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<section id="v-login" class="login hidden">
  <div class="fcard">
    <div class="fhd"><div class="mark" style="background:#fff;color:var(--acc);width:26px;height:26px;font-size:9px">GHC</div>Requisiciones · Compras</div>
    <form id="f-login" style="padding:18px">
      <div class="fg"><label>Correo</label><input id="l-email" type="email" autocomplete="username" required></div>
      <div class="fg"><label>Contraseña</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
      <p id="l-err" class="hidden" style="color:var(--red);font-size:11px;margin-bottom:8px"></p>
      <button class="bsub" style="width:100%;justify-content:center" id="l-btn">Entrar</button>
    </form>
  </div>
</section>

<div class="shell hidden" id="v-app">
  <div class="L">
    <div class="lhd">
      <div class="lhd-top">
        <div class="brand"><div class="mark">GHC</div><div><h1>Requisiciones</h1><p id="me-line">GHC · Compras</p></div></div>
        <div style="display:flex;gap:4px">
          <button class="btn-new alt" id="b-dash" title="Tablero">📊</button>
          <button class="btn-new alt" id="b-xls" title="Exportar a Excel lo filtrado">⬇ XLS</button>
          <button class="btn-new alt hidden" id="b-users" title="Usuarios">👤</button>
          <button class="btn-new alt" id="b-bell" title="Avisos de requisiciones nuevas">🔔</button>
          <button class="btn-new alt" id="b-out" title="Cerrar sesión">⏻</button>
        </div>
      </div>
    </div>
    <div class="lsrch">
      <div class="sbox"><svg class="si" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="q" placeholder="Folio, obra, material, solicitante…"></div>
      <div class="chips" id="chips"></div>
      <select class="fsel" id="f-obra"><option value="">Todas las obras</option></select>
      <div class="fgrid">
        <select class="fsel" id="f-cli"><option value="">Todos los clientes</option></select>
        <select class="fsel" id="f-sol"><option value="">Todos los solicitantes</option></select>
        <select class="fsel" id="f-asg"><option value="">Cualquier comprador</option><option value="__yo">Asignadas a mí</option><option value="__none">Sin asignar</option></select>
        <select class="fsel" id="f-sort"><option value="fecha">Orden: fecha requerida</option><option value="nuevas">Más recientes</option><option value="viejas">Más antiguas</option></select>
        <input class="fsel" type="date" id="f-desde" title="Creadas desde">
        <input class="fsel" type="date" id="f-hasta" title="Creadas hasta">
      </div>
      <label style="display:flex;gap:6px;align-items:center;font-size:11px;margin-top:6px;color:var(--mut)"><input type="checkbox" id="f-urg"> Solo urgentes</label>
    </div>
    <div class="rlist" id="rlist"><div class="lempty"><span class="spin"></span>Cargando…</div></div>
    <div class="lfoot"><span class="live">En vivo</span><span id="lcount"></span></div>
  </div>
  <div class="R" id="R">
    <div class="empty-r"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/></svg>
      <h2>Selecciona una requisición</h2><p>O abre el tablero con 📊</p></div>
  </div>
</div>

<script>
const SB_URL='https://fssbqencxpmmjmxgnmpe.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzc2JxZW5jeHBtbWpteGdubXBlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2NzM5NzUsImV4cCI6MjA3MDI0OTk3NX0.fsWpdmHPaKYn8P767fo5rqPHkBsQbDjplXs2xbGg9MY';
const BUCKET='requisiciones';
const sb=supabase.createClient(SB_URL,SB_KEY,{db:{schema:'ops'},auth:{persistSession:true,storageKey:'ghc-req-compras-auth'}});

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fDate=s=>{if(!s)return'—';const d=new Date(s.length<=10?s+'T12:00:00':s);return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'2-digit'})};
const fDT=s=>s?new Date(s).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const fNum=n=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:3});
const fMoney=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const num=v=>Number(String(v??'').replace(/,/g,''))||0;
const stCls=s=>'st-'+String(s||'').replace(/%/g,'').replace(/\s+/g,'-');
const chip=s=>`<span class="bdg ${stCls(s)}">${esc(s)}</span>`;
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
function toast(m,k){const t=document.createElement('div');t.className='toast'+(k?' '+k:'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),k==='err'?5000:2800)}
const ENT={obra:'📍 Obra',otra_direccion:'🚚 Otra dirección',recoger:'🏬 Recoger'};
function dueCls(d){if(!d)return'';const days=(new Date(d+'T23:59:59')-new Date())/864e5;return days<0?'due-late':days<=2?'due-soon':''}
const hrs=ms=>ms==null?'—':ms<36e5?Math.round(ms/6e4)+' min':ms<864e5*2?(ms/36e5).toFixed(1)+' h':(ms/864e5).toFixed(1)+' d';
const safeName=n=>String(n||'archivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.appendChild(s)})}

const S={me:null,list:[],filter:'sin_tomar',selId:null,detail:null,chList:null,chDet:null,sel:new Set(),view:'list',known:new Set(),unread:0};
const myName=()=>S.me?.nombre||S.me?.email;
const FILTERS=[
  ['sin_tomar','Sin tomar',r=>r.n_pendiente>0&&r.estatus!=='Cancelada'],
  ['mias','Mías',r=>(r.asignado_a===myName()||(r.tomado_por||'').split(', ').includes(myName()))&&!['Pagada','Cancelada'].includes(r.estatus)],
  ['en_compra','En compra',r=>r.estatus==='En compra'],
  ['parcial','OC parcial',r=>r.estatus==='OC parcial'],
  ['oc100','100% OC',r=>r.estatus==='100% con OC'],
  ['vencidas','Vencidas',r=>r.proxima_fecha&&dueCls(r.proxima_fecha)==='due-late'],

/* AUTH */
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session&&await loadMe(session))return showApp();$('#v-login').classList.remove('hidden')}
async function loadMe(session){
  const {data}=await sb.from('usuario_app').select('*').eq('email',session.user.email.toLowerCase()).maybeSingle();
  if(!data||!data.activo||!['compras','admin'].includes(data.rol)){await sb.auth.signOut();$('#l-err').textContent='Tu usuario no tiene acceso a Compras.';$('#l-err').classList.remove('hidden');return false}
  S.me=data;return true;
}
$('#f-login').onsubmit=async e=>{e.preventDefault();$('#l-err').classList.add('hidden');$('#l-btn').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('#l-email').value.trim(),password:$('#l-pass').value});$('#l-btn').disabled=false;
  if(error){$('#l-err').textContent=error.message.includes('Invalid')?'Correo o contraseña incorrectos':error.message;$('#l-err').classList.remove('hidden');return}
  if(await loadMe(data.session))showApp()};
$('#b-out').onclick=async()=>{await sb.auth.signOut();location.reload()};

function showApp(){
  $('#v-login').classList.add('hidden');$('#v-app').classList.remove('hidden');
  $('#me-line').textContent='GHC · '+(S.me.rol==='admin'?'Admin':'Compras')+' · '+myName();
  if(S.me.rol==='admin')$('#b-users').classList.remove('hidden');
  ['#q','#f-obra','#f-cli','#f-sol','#f-asg','#f-sort','#f-desde','#f-hasta','#f-urg'].forEach(s=>$(s).addEventListener(s==='#q'?'input':'change',debounce(renderList,150)));
  $('#b-dash').onclick=viewDashboard;$('#b-users').onclick=viewUsers;$('#b-xls').onclick=exportXls;$('#b-bell').onclick=enableBell;
  if('Notification' in window&&Notification.permission==='granted')$('#b-bell').classList.add('on');
  loadList(true);
  S.chList=sb.channel('lista').on('postgres_changes',{event:'*',schema:'ops',table:'requisicion'},p=>{if(p.eventType==='INSERT')notifyNew(p.new);debouncedList()}).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){S.unread=0;document.title='Requisiciones · Compras · GHC'}});
}
const debouncedList=debounce(()=>loadList(),700);

/* Avisos */
function enableBell(){
  if(!('Notification' in window))return toast('Este navegador no soporta avisos','err');
  Notification.requestPermission().then(p=>{if(p==='granted'){$('#b-bell').classList.add('on');toast('Avisos activados: te avisaremos de cada requisición nueva','ok')}else toast('Avisos bloqueados en el navegador','err')});
}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start();o.stop(c.currentTime+.5)}catch(e){}}
function notifyNew(r){
  beep();toast(`Nueva requisición ${r.folio} · ${r.solicitante_nombre||''}${r.urgente?' · URGENTE':''}`,'ok');
  if(document.hidden){S.unread++;document.title=`(${S.unread}) Requisiciones · Compras`}
  if('Notification' in window&&Notification.permission==='granted'){const n=new Notification('Nueva requisición '+r.folio,{body:(r.solicitante_nombre||'')+(r.urgente?' · URGENTE':''),tag:r.req_uuid});n.onclick=()=>{window.focus();openDetail(r.req_uuid)}}
}

/* LISTA */
async function loadList(first){
  const {data,error}=await sb.from('v_req').select('*').order('created_at',{ascending:false}).limit(2000);
  if(error){$('#rlist').innerHTML=`<div class="lempty">Error: ${esc(error.message)}</div>`;return}
  S.list=data;
  const fill=(id,vals,label)=>{const el=$(id),cur=el.value;el.innerHTML=`<option value="">${label}</option>`+(id==='#f-asg'?'<option value="__yo">Asignadas a mí</option><option value="__none">Sin asignar</option>':'')+vals.map(v=>`<option value="${esc(v[0])}">${esc(v[1])}</option>`).join('');el.value=cur};
  const uniq=(f,g)=>[...new Map(data.filter(f).map(r=>[g(r)[0],g(r)])).values()].sort((a,b)=>a[1].localeCompare(b[1]));
  fill('#f-obra',uniq(r=>r.project_uuid,r=>[r.project_uuid,(r.project_id?r.project_id+' · ':'')+r.project_name]),'Todas las obras');
  fill('#f-cli',uniq(r=>r.client_name,r=>[r.client_name,r.client_name]),'Todos los clientes');
  fill('#f-sol',uniq(r=>r.solicitante_email,r=>[r.solicitante_email,r.solicitante_nombre||r.solicitante_email]),'Todos los solicitantes');
  fill('#f-asg',uniq(r=>r.asignado_a,r=>[r.asignado_a,r.asignado_a]),'Cualquier comprador');
  renderList();
  if(S.view==='dash')renderDashboard();
}
function applyFilters(base){
  const q=$('#q').value.trim().toLowerCase(),obra=$('#f-obra').value,cli=$('#f-cli').value,sol=$('#f-sol').value,asg=$('#f-asg').value,de=$('#f-desde').value,ha=$('#f-hasta').value,urg=$('#f-urg').checked;
  return base.filter(r=>(!q||[r.folio,r.project_id,r.project_name,r.client_name,r.rfps,r.solicitante_nombre,r.solicitante_email,r.tomado_por,r.asignado_a,r.items_txt].join(' ').toLowerCase().includes(q))
    &&(!obra||r.project_uuid===obra)&&(!cli||r.client_name===cli)&&(!sol||r.solicitante_email===sol)
    &&(!asg||(asg==='__yo'?r.asignado_a===myName():asg==='__none'?!r.asignado_a:r.asignado_a===asg))
    &&(!de||r.created_at.slice(0,10)>=de)&&(!ha||r.created_at.slice(0,10)<=ha)&&(!urg||r.urgente));
}
function sortRows(rows){
  const s=$('#f-sort').value;
  if(s==='fecha')rows.sort((a,b)=>((!!b.urgente)-(!!a.urgente))||((a.proxima_fecha||'9999')<(b.proxima_fecha||'9999')?-1:(a.proxima_fecha||'9999')>(b.proxima_fecha||'9999')?1:a.created_at<b.created_at?-1:1));
  if(s==='nuevas')rows.sort((a,b)=>a.created_at<b.created_at?1:-1);
  if(s==='viejas')rows.sort((a,b)=>a.created_at<b.created_at?-1:1);
  return rows;
}
function renderList(){
  const base=applyFilters(S.list);
  $('#chips').innerHTML=FILTERS.map(([k,l,f])=>`<span class="chip ${S.filter===k?'on':''}" data-k="${k}">${l}<span class="c">${base.filter(f).length}</span></span>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.filter=c.dataset.k;renderList()});
  const rows=sortRows(base.filter(FILTERS.find(f=>f[0]===S.filter)[2]));
  S.filtered=rows;
  $('#lcount').textContent=rows.length+' de '+S.list.length;
  $('#rlist').innerHTML=rows.length?rows.map(r=>`<div class="ritem ${r.req_uuid===S.selId?'sel':''} ${r.urgente?'urg':''}" data-id="${r.req_uuid}">
    <div style="display:flex;justify-content:space-between;gap:6px;align-items:center"><span class="ri-num">${esc(r.folio)}${r.n_adjuntos?' 📎':''}${r.n_cotizaciones?' 💲':''}</span><span>${r.urgente?'<span class="bdg b-urg">URG</span> ':''}${chip(r.estatus)}</span></div>

  </div>`).join(''):'<div class="lempty">No hay requisiciones con estos filtros.</div>';
  $('#rlist').querySelectorAll('.ritem').forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
}

/* DETALLE */
async function openDetail(id){
  S.view='det';S.selId=id;S.sel=new Set();$('#b-dash').classList.remove('on');
  document.querySelectorAll('.ritem').forEach(el=>el.classList.toggle('sel',el.dataset.id===id));
  $('#R').innerHTML='<div class="lempty" style="padding-top:80px"><span class="spin"></span>Cargando…</div>';
  if(S.chDet){sb.removeChannel(S.chDet);S.chDet=null}
  await loadDetail(id);
  const rl=debounce(()=>{if(S.selId===id&&!$('.modal-ov'))loadDetail(id)},400);
  S.chDet=sb.channel('det-'+id)
   .on('postgres_changes',{event:'*',schema:'ops',table:'requisicion_item',filter:`req_uuid=eq.${id}`},rl)
   .on('postgres_changes',{event:'*',schema:'ops',table:'requisicion_cotizacion',filter:`req_uuid=eq.${id}`},rl)
   .on('postgres_changes',{event:'INSERT',schema:'ops',table:'requisicion_evento',filter:`req_uuid=eq.${id}`},rl).subscribe();
}
async function loadDetail(id){
  const [r,it,sp,ad,ev,ct]=await Promise.all([
    sb.from('v_req').select('*').eq('req_uuid',id).maybeSingle(),
    sb.from('requisicion_item').select('*,links:oc_requisicion_item(id,cantidad,oc:oc_uuid(oc_uuid,oc_number,status,proveedor_nombre_corto,total))').eq('req_uuid',id).order('partida'),
    sb.from('requisicion_rfp').select('pct,rfp_uuid,project_uuid,rfp:rfp_uuid(rfp_number,titulo),project:project_uuid(project_id,project_name)').eq('req_uuid',id),
    sb.from('requisicion_adjunto').select('*').eq('req_uuid',id).order('created_at'),
    sb.from('requisicion_evento').select('*').eq('req_uuid',id).order('created_at',{ascending:false}).limit(200),
    sb.from('requisicion_cotizacion').select('*').eq('req_uuid',id).order('created_at')
  ]);
  if(S.selId!==id)return;
  if(!r.data){$('#R').innerHTML='<div class="empty-r"><h2>No encontrada</h2></div>';return}
  const items=it.data||[];
  const ids=items.filter(x=>x.split_especial).map(x=>x.item_uuid);
  const isp=ids.length?(await sb.from('requisicion_item_rfp').select('item_uuid,pct,rfp_uuid,rfp:rfp_uuid(rfp_number)').in('item_uuid',ids)).data||[]:[];
  const {data:ocf}=await sb.from('oc').select('oc_uuid,oc_number,status,proveedor_nombre_corto,total,requisition_number').ilike('requisition_number',r.data.folio);
  const linked=new Set(items.flatMap(x=>(x.links||[]).map(l=>l.oc?.oc_uuid)));
  S.detail={q:r.data,items,split:sp.data||[],adj:ad.data||[],ev:ev.data||[],isp,cot:ct.data||[],ocSug:(ocf||[]).filter(o=>!linked.has(o.oc_uuid))};
  S.sel=new Set([...S.sel].filter(x=>items.some(i=>i.item_uuid===x)));
  renderDetail();
}

/* Copiar para OC: partidas agrupadas por su reparto real */
async function copyForOC(list){
  if(!list.length)return;
  const {q,split,isp}=S.detail;
  const spOf=x=>{const s=isp.filter(y=>y.item_uuid===x.item_uuid);return(s.length?s:split).map(y=>(y.rfp?.rfp_number||'RFP')+' '+(+y.pct)+'%').join(' + ')};
  const groups={};list.forEach(x=>{const k=spOf(x);(groups[k]=groups[k]||[]).push(x)});
  const ents=[...new Set(list.map(x=>x.entrega_tipo==='obra'?'Obra: '+[q.project_address,q.project_city_state].filter(Boolean).join(', '):(x.entrega_tipo==='recoger'?'Recoger: ':'Entregar en: ')+x.entrega_direccion))];
  let txt=`Requisición: ${q.folio}\nObra: ${q.project_id||''} ${q.project_name}\nSolicitó: ${q.solicitante_nombre||q.solicitante_email}\nEntrega: ${ents.join(' | ')}\nFecha requerida más próxima: ${fDate(list.map(x=>x.fecha_requerida).filter(Boolean).sort()[0])}\n`;
  for(const [k,its] of Object.entries(groups)){
    txt+=`\nSplit ${k}${Object.keys(groups).length>1?' ('+its.length+' partidas)':''}\nCantidad\tUnidad\tDescripción\n`;
    txt+=its.map(x=>[fNum(Math.max(0,x.cantidad-x.cantidad_con_oc))||fNum(x.cantidad),x.unidad||'',x.descripcion+(x.especificacion?' - '+x.especificacion:'')].join('\t')).join('\n')+'\n';
  }
  if(Object.keys(groups).length>1)txt+=`\n⚠ Las partidas tienen splits distintos: considera una OC por grupo, o calcula el split con los importes reales.`;
  await navigator.clipboard.writeText(txt);toast(Object.keys(groups).length>1?'Copiado en '+Object.keys(groups).length+' grupos de split':'Copiado. Usa el folio '+q.folio+' en la OC','ok');
}

   <div class="dcard"><div class="dcard-hd"><div><div class="dcard-num">TABLERO</div><div class="dcard-tit">Requisiciones · Compras</div><div class="dcard-sub">Respeta los filtros del panel izquierdo · ${L.length} requisiciones</div></div><div class="hd-r"><button class="abtn" onclick="exportXls()">⬇ Exportar a Excel</button></div></div>
    <div class="kpis">${kpi('Abiertas',open.length)}${kpi('Sin tomar',L.filter(r=>r.n_pendiente>0&&r.estatus!=='Cancelada').length,'var(--amber)')}${kpi('Vencidas sin OC',venc,venc?'var(--red)':'')}${kpi('Urgentes abiertas',open.filter(r=>r.urgente).length,'var(--red)')}${kpi('Tiempo a tomar',hrs(tTake))}${kpi('Tiempo a 1ª OC',hrs(tOC))}</div>
    <div class="kpis" style="border-top:1px solid var(--bdr)">${kpi('100% con OC',L.filter(r=>r.estatus==='100% con OC').length,'var(--vio)')}${kpi('Pagadas',L.filter(r=>r.estatus==='Pagada').length,'var(--grn)')}${kpi('Recibidas 100%',L.filter(r=>(r.pct_recibido||0)>=100).length,'var(--grn)')}${kpi('Con cotizaciones',L.filter(r=>r.n_cotizaciones>0).length)}${kpi('Partidas',L.reduce((s,r)=>s+r.total_items,0))}${kpi('Canceladas',L.filter(r=>r.estatus==='Cancelada').length)}</div></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">
    <div class="dcard"><div class="cardt"><h3>Abiertas por comprador</h3></div><div style="padding:6px 0">${bars(byBuyer,byBuyer[0]?.[1])}</div></div>
    <div class="dcard"><div class="cardt"><h3>Abiertas por obra (top 10)</h3></div><div style="padding:6px 0">${bars(byObra,byObra[0]?.[1])}</div></div>
   </div>
   <div style="display:grid;grid-template-columns:2fr 1fr;gap:13px">
    <div class="dcard"><div class="cardt"><h3>Requisiciones creadas · últimos 30 días</h3></div><div class="days">${days.map(([k,v])=>`<div style="height:${v/dmax*100}%" data-t="${fDate(k)}: ${v}"></div>`).join('')}</div><div style="display:flex;justify-content:space-between;padding:0 18px 10px;font-size:10px;color:var(--mut);font-family:var(--mono)"><span>${fDate(days[0][0])}</span><span>hoy</span></div></div>
    <div class="dcard"><div class="cardt"><h3>Quién pide más (top 10)</h3></div><div style="padding:6px 0">${bars(bySol,bySol[0]?.[1])}</div></div>
   </div></div>`;
}

/* USUARIOS (admin) */
async function viewUsers(){
  S.view='users';S.selId=null;$('#b-dash').classList.remove('on');
  const [{data:us},{data:rs}]=await Promise.all([sb.from('usuario_app').select('*').order('nombre'),sb.from('resident').select('resident_id,full_name,email,activo').order('full_name')]);
  S.residents=rs||[];
  $('#R').innerHTML=`<div class="detail"><div class="dcard"><div class="dcard-hd"><div><div class="dcard-num">USUARIOS</div><div class="dcard-tit">Accesos a Requisiciones</div><div class="dcard-sub">“Contraseña” crea el acceso si no existe o pone una nueva.</div></div><div class="hd-r"><button class="abtn prim" id="u-new">＋ Nuevo usuario</button></div></div>
   <div style="padding:10px 18px;border-bottom:1px solid var(--bdr)"><div class="sbox"><svg class="si" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="uq" placeholder="Buscar"></div></div>
   <div id="uw"></div></div></div>`;
  const draw=()=>{const q=$('#uq').value.toLowerCase();
    $('#uw').innerHTML=`<table class="items-table"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Residente ligado</th><th>Activo</th><th></th></tr></thead><tbody>${(us||[]).filter(u=>!q||(u.nombre+' '+u.email).toLowerCase().includes(q)).map(u=>`<tr>
     <td>${esc(u.nombre||'')}</td><td class="mono" style="font-size:11px">${esc(u.email)}</td>
     <td><select data-rol="${esc(u.email)}" style="width:auto">${['residente','compras','admin'].map(r=>`<option ${u.rol===r?'selected':''}>${r}</option>`).join('')}</select></td>
     <td style="font-size:11px">${esc(S.residents.find(r=>r.resident_id===u.resident_id)?.full_name||'—')}</td>
     <td><input type="checkbox" data-act="${esc(u.email)}" ${u.activo?'checked':''}></td>
     <td><button class="abtn" data-pw="${esc(u.email)}">🔑 Contraseña</button></td></tr>`).join('')}</tbody></table>`;
    $('#uw').querySelectorAll('[data-rol]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('usuario_app').update({rol:s.value}).eq('email',s.dataset.rol);toast(error?error.message:'Rol actualizado',error?'err':'ok')});
    $('#uw').querySelectorAll('[data-act]').forEach(c=>c.onchange=async()=>{const {error}=await sb.from('usuario_app').update({activo:c.checked}).eq('email',c.dataset.act);toast(error?error.message:'Actualizado',error?'err':'ok')});
    $('#uw').querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>setPassword(b.dataset.pw));
  };
  $('#uq').oninput=draw;draw();
  $('#u-new').onclick=()=>modal(`<div class="modal-title">Nuevo usuario</div><div class="modal-sub">Se crea su acceso con la contraseña que indiques.</div>
    <div class="fg"><label>Residente (opcional, para ligar sus obras)</label><select id="nr"><option value="">— Ninguno —</option>${S.residents.filter(r=>r.activo).map(r=>`<option value="${r.resident_id}" data-e="${esc(r.email||'')}" data-n="${esc(r.full_name)}">${esc(r.full_name)}</option>`).join('')}</select></div>
    <div class="frow c2"><div class="fg"><label>Nombre</label><input id="nn"></div><div class="fg"><label>Correo</label><input id="ne" type="email"></div></div>
    <div class="frow c2"><div class="fg"><label>Rol</label><select id="nrol"><option>residente</option><option>compras</option><option>admin</option></select></div><div class="fg"><label>Contraseña inicial (mín. 8)</label><input id="np" autocomplete="new-password"></div></div>
    <div class="modal-footer"><button class="bcancel" id="nx">Cancelar</button><button class="bsub" id="nok">Crear</button></div>`,b=>{
      b.querySelector('#nr').onchange=e=>{const o=e.target.selectedOptions[0];if(o.value){b.querySelector('#nn').value=o.dataset.n;b.querySelector('#ne').value=o.dataset.e}};
      b.querySelector('#nx').onclick=()=>b.remove();
      b.querySelector('#nok').onclick=async()=>{
        const email=b.querySelector('#ne').value.trim().toLowerCase(),pw=b.querySelector('#np').value;
        if(!email||pw.length<8)return toast('Correo y contraseña (mín. 8) son obligatorios','err');
        const {error}=await sb.from('usuario_app').upsert({email,nombre:b.querySelector('#nn').value.trim(),rol:b.querySelector('#nrol').value,resident_id:b.querySelector('#nr').value||null,activo:true});
        if(error)return toast(error.message,'err');
        const r=await callAdmin({action:'create',email,password:pw});if(r.error)return toast(r.error,'err');
        b.remove();toast('Usuario creado','ok');viewUsers();
      };
    });
}
async function callAdmin(body){
  const {data,error}=await sb.functions.invoke('req-usuarios',{body});
  if(error){let msg=error.message;try{msg=(await error.context.json()).error||msg}catch(e){}return{error:msg}}
  return data;
}
function setPassword(email){
  modal(`<div class="modal-title">Contraseña de ${esc(email)}</div><div class="modal-sub">Si aún no tiene acceso, se le crea.</div><div class="fg"><label>Nueva contraseña (mín. 8)</label><input id="pp" autocomplete="new-password"></div>
   <div class="modal-footer"><button class="bcancel" id="px">Cancelar</button><button class="bsub" id="pok">Guardar</button></div>`,b=>{
    b.querySelector('#px').onclick=()=>b.remove();
    b.querySelector('#pok').onclick=async()=>{const pw=b.querySelector('#pp').value;if(pw.length<8)return toast('Mínimo 8 caracteres','err');
      const r=await callAdmin({action:'set_password',email,password:pw});if(r.error)return toast(r.error,'err');b.remove();toast(r.creado?'Acceso creado':'Contraseña actualizada','ok')};
  });
}

sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.me)location.reload()});
boot();
</script>
